<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reading — modsquareunderroot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-bar reader-bar">
    <a class="back" href="works.html">All works</a>
    <div class="right">
      <div class="modes" role="group" aria-label="Reading mode">
        <button data-mode="read" aria-pressed="true">Read</button>
        <button data-mode="immerse" aria-pressed="false">Immerse</button>
      </div>
      <button class="sound-toggle" data-sound-toggle aria-pressed="false">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sound-label">Sound</span>
      </button>
    </div>
  </header>

  <main>
    <article class="reading" id="reading">
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
      <div class="body" id="body"></div>
      <p class="end" aria-hidden="true">fin</p>
    </article>
  </main>

  <section class="diary" id="diary" aria-label="Immersive reading">
    <div class="diary-page" id="page" title="Click to hurry the ink"></div>
    <div class="diary-controls">
      <button id="restart">Start over</button>
      <button id="pause">Pause</button>
      <div class="diary-progress" id="progress" aria-hidden="true"></div>
      <button id="next">Next</button>
    </div>
  </section>

  <script src="data/works.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
