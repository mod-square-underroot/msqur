<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The works — modsquareunderroot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-bar">
    <a class="wordmark" href="index.html" data-site-name>modsquareunderroot</a>
    <button class="sound-toggle" data-sound-toggle aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="sound-label">Sound</span>
    </button>
  </header>

  <section class="index-head">
    <h1 class="index-title">the works</h1>
    <p class="index-intro" data-site-blurb></p>
  </section>

  <nav class="filters" aria-label="Filter by form">
    <button aria-pressed="true" data-filter="all">All</button>
    <button aria-pressed="false" data-filter="poem">Poetry</button>
    <button aria-pressed="false" data-filter="prose">Prose</button>
  </nav>

  <ul class="work-list" id="list"></ul>

  <script src="data/works.js"></script>
  <script src="js/sound.js"></script>
  <script>
    (function () {
      const site = window.SITE || {}, works = window.WORKS || [];
      document.querySelector("[data-site-name]").textContent = site.name || "Home";
      document.querySelector("[data-site-blurb]").textContent = site.blurb || "";
      if (site.name) document.title = "The works — " + site.name;

      const list = document.getElementById("list");
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      list.innerHTML = works.map(w => {
        const first = w.text.trim().split("\n")[0];
        const excerpt = w.form === "poem" ? first : first.split(/(?<=[.!?])\s/)[0];
        return `<li data-form="${esc(w.form)}">
          <a class="work-link" href="work.html#${esc(w.slug)}">
            <h2>${esc(w.title)}</h2>
            <span class="meta">${w.form === "poem" ? "poem" : "prose"}${w.year ? ", " + esc(w.year) : ""}</span>
            <p class="first-line">${esc(excerpt)}</p>
          </a></li>`;
      }).join("") || `<li><p class="first-line">Nothing here yet. Add your first piece in data/works.js.</p></li>`;

      document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
        const f = btn.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b === btn));
        list.querySelectorAll("li[data-form]").forEach(li => { li.hidden = f !== "all" && li.dataset.form !== f; });
      }));
    })();
  </script>
</body>
</html>
